sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness Application
sonar.projectVersion=3.2.4
sonar.sourceEncoding=UTF-8

# Source code location
sonar.sources=.
sonar.exclusions=**/*.pyc,**/tests/**,**/test_*.py,**/venv/**,.git/**,htmlcov/**

# Test coverage
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Code coverage
sonar.coverage.exclusions=**/*test*.py,**/tests/**

# Python version
sonar.python.version=3.11

# Duplication
sonar.cpd.exclusions=**/test_*.py

# Issues
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=py:S1481
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*test*.py
