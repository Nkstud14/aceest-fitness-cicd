apiVersion: v1
kind: Namespace
metadata:
  name: production
---
# Blue Deployment (Current Production Version)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-blue
  namespace: production
  labels:
    app: aceest-fitness
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      version: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: blue
    spec:
      containers:
      - name: aceest-fitness
        image: docker.io/username/aceest-fitness:3.2.3
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
# Green Deployment (New Version to be tested)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-green
  namespace: production
  labels:
    app: aceest-fitness
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      version: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: green
    spec:
      containers:
      - name: aceest-fitness
        image: docker.io/username/aceest-fitness:3.2.4
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
# Service pointing to Blue (Current Production)
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness
  namespace: production
  labels:
    app: aceest-fitness
spec:
  type: LoadBalancer
  selector:
    app: aceest-fitness
    version: blue
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
---
# Service for Green (Testing)
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-green
  namespace: production
  labels:
    app: aceest-fitness
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    version: green
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
---
# Service for Blue (Current)
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-blue
  namespace: production
  labels:
    app: aceest-fitness
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    version: blue
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
---
# Ingress for Blue-Green
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness
  namespace: production
spec:
  rules:
  - host: aceest-fitness.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-fitness
            port:
              number: 80
  - host: aceest-fitness-green.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-fitness-green
            port:
              number: 80
---
# Job to run smoke tests on Green before switching
apiVersion: batch/v1
kind: Job
metadata:
  name: aceest-fitness-green-tests
  namespace: production
spec:
  template:
    spec:
      containers:
      - name: test
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Testing Green deployment..."
          curl -f http://aceest-fitness-green:80/health || exit 1
          curl -f http://aceest-fitness-green:80/ready || exit 1
          echo "Green deployment tests passed!"
      restartPolicy: Never
  backoffLimit: 3
---
# Manual approval required - Switch Service to Green
# kubectl patch service aceest-fitness -n production -p '{"spec":{"selector":{"version":"green"}}}'
# To rollback to Blue:
# kubectl patch service aceest-fitness -n production -p '{"spec":{"selector":{"version":"blue"}}}'
