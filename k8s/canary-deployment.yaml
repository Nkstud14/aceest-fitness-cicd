apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: fluxcd.io/v1
kind: Canary
metadata:
  name: aceest-fitness-canary
  namespace: production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aceest-fitness
  progressDeadlineSeconds: 300
  service:
    name: aceest-fitness
    port: 80
  analysis:
    interval: 1m
    threshold: 10
    maxWeight: 50
    stepWeight: 5
    metrics:
    - name: request-success-rate
      thresholdRange:
        min: 99
      interval: 1m
    - name: request-duration
      thresholdRange:
        max: 500
      interval: 1m
  skipAnalysis: false
---
# Prometheus ServiceMonitor for metrics collection
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aceest-fitness
  namespace: production
spec:
  selector:
    matchLabels:
      app: aceest-fitness
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
---
# Alert Rules for Canary Deployment
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aceest-fitness-alerts
  namespace: production
spec:
  groups:
  - name: aceest-fitness
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: rate(http_requests_total{job="aceest-fitness",status=~"5.."}[5m]) > 0.05
      for: 5m
      annotations:
        summary: High error rate detected
    - alert: HighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
      for: 5m
      annotations:
        summary: High latency detected
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[1h]) > 0
      for: 1m
      annotations:
        summary: Pod is crash looping
---
# Virtual Service for traffic management with Flagger
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: aceest-fitness
  namespace: production
spec:
  hosts:
  - aceest-fitness
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: aceest-fitness
        port:
          number: 80
      weight: 100
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
---
# Destination Rule for connection pooling
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: aceest-fitness
  namespace: production
spec:
  host: aceest-fitness
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
  - name: v1
    labels:
      version: "3.2.4"
  - name: v2
    labels:
      version: "3.2.5"
